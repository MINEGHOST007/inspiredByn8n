server:
  address: ${W6W_BIND_ADDRESS:127.0.0.1}
  port: ${W6W_PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: w6w-local
  datasource:
    url: jdbc:h2:file:${W6W_DB_PATH:./data/w6w-demo};AUTO_SERVER=TRUE
    username: ${W6W_DB_USER:sa}
    password: ${W6W_DB_PASSWORD:}
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: false
  jackson:
    default-property-inclusion: non_null

flowable:
  database-schema-update: true
  async-executor-activate: false

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

w6w:
  workflows-dir: ${W6W_WORKFLOWS_DIR:./code/workflows}
  runtime-mode: ${W6W_RUNTIME_MODE:local-demo}
