name: Workflows CI

on:
  push:
    paths:
      - 'code/workflows/**'
  pull_request:
    paths:
      - 'code/workflows/**'

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'maven'

      - name: Run Scenario Tests and Emit Results
        working-directory: code/platform
        run: mvn --batch-mode -pl modules/w6w-test -am test

      - name: Upload Scenario Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: workflow-scenario-results
          path: code/platform/**/target/surefire-reports/TEST-*.xml
